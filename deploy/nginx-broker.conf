# ┌────────────────────────────────────────────────────────────────────┐
# │  BrokerReport: HTTPS напрямую на VPS (вместо Cloudflare Tunnel)    │
# └────────────────────────────────────────────────────────────────────┘
#
# Зачем: Cloudflare отдавал зону roman-it.dev из дата-центра в Гонконге.
# Из России это 207 мс RTT и ~10 КБ/с — страница входа (73 КБ в сжатом
# виде) открывалась десятки секунд. Прямое подключение к серверу в
# Амстердаме: 48 мс и единицы МБ/с.
#
# Схема:
#   клиент --443/TLS--> nginx --http--> 127.0.0.1:5000 (контейнер broker-report)
#
# DNS: broker.roman-it.dev = A 78.17.114.178, ОБЯЗАТЕЛЬНО «DNS only»
# (серое облако). Если включить прокси, клиент снова попадёт в Cloudflare
# и скорость вернётся к прежней.
#
# Сертификат: Let's Encrypt, проверка DNS-01 через токен Cloudflare
# (не требует открытого 80-го порта), поэтому файл в
# /etc/letsencrypt/live/broker.roman-it.dev/ создаётся до переключения DNS.
#
# Установка:
#   cp deploy/nginx-broker.conf /etc/nginx/sites-available/broker
#   ln -sf /etc/nginx/sites-available/broker /etc/nginx/sites-enabled/broker
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Проверка конфига и перезагрузка:
#   nginx -t && systemctl reload nginx

# ── Запросы по IP и с чужим Host: молча закрываем соединение ────────
# Иначе nginx отдал бы их первому попавшемуся vhost, и в приложение
# уходил бы подделанный заголовок Host.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ── HTTPS с чужим Host: тоже закрываем ─────────────────────────────
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/broker.roman-it.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/broker.roman-it.dev/privkey.pem;
    return 444;
}

# ── HTTP: только проверка ACME и редирект на HTTPS ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name broker.roman-it.dev;

    # Сюда certbot кладёт файлы проверки, если перейдём на HTTP-01.
    # Сейчас используется DNS-01, но каталог не мешает и упрощает миграцию.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: приложение ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name broker.roman-it.dev;

    ssl_certificate     /etc/letsencrypt/live/broker.roman-it.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/broker.roman-it.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Сайт открыт в интернет напрямую — просим браузер не ходить по http
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # Cloudflare сжимал brotli автоматически; у стокового nginx только gzip.
    # CSS/JS/HTML ужимаются в ~5 раз, woff2 уже сжат — его не трогаем.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml;

    # Загрузка отчётов (HTML/XLSX) идёт через POST на /upload
    client_max_body_size 64m;
    client_body_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # $remote_addr, а не $proxy_add_x_forwarded_for: клиент не должен
        # иметь возможности подставить свой X-Forwarded-For (приложение
        # по IP ведёт счётчик неудачных входов).
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # gunicorn запущен с --timeout 120, ждём столько же
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # Логотипы тикеров — SVG, генерируются на лету и кэшируются на сутки
    location /api/logo/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
